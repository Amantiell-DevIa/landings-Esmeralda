<!-- 09 FUTURE PACING -->
<div class="bootcamp-event-page circle-gold-page">
  <section id="transformacion" class="bo-section cg-section cg-section--alt cg-v2-section cg-v2-future cg-reveal"
    aria-labelledby="cg-future-title">
    <div class="bo-container cg-v2-future__layout">
      <header class="cg-v2-heading cg-v2-heading--center">
        <p class="cg-v2-eyebrow">LA TRANSFORMACIÓN</p>
        <h2 id="cg-future-title">MISMA JOYA. <span class="cg-gold-metallic-badge">DIFERENTE MENTALIDAD.</span></h2>
      </header>

      <div class="cg-v2-future__comparison cg-future-cards">
        <!-- Tarjeta ANTES -->
        <div class="cg-future-card cg-future-card--before">
          <div class="cg-future-card__header">
            <div class="cg-future-card__icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" opacity="0.4" />
                <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  opacity="0.4" />
              </svg>
            </div>
            <span class="cg-future-card__badge cg-future-card__badge--before">ANTES</span>
          </div>
          <div class="cg-future-card__body">
            <p class="cg-future-card__title">"Se ve bien, seguro es cara."</p>
            <small class="cg-future-card__desc">Miras la pieza. No sabes qué preguntar. Pagas lo que te digan.</small>
          </div>
        </div>

        <!-- Indicador central de Transición -->
        <div class="cg-future-arrow-wrapper">
          <div class="cg-future-arrow" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M5 12h14m0 0l-6-6m6 6l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </div>
        </div>

        <!-- Tarjeta AHORA -->
        <div class="cg-future-card cg-future-card--after">
          <div class="cg-future-card__header">
            <div class="cg-future-card__icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke="#d9b54a" stroke-width="1.8" />
                <circle cx="12" cy="12" r="4" fill="#d9b54a" opacity="0.3" />
                <circle cx="12" cy="12" r="2" fill="#d9b54a" />
              </svg>
            </div>
            <span class="cg-future-card__badge cg-future-card__badge--after">AHORA CON GOLD</span>
          </div>
          <div class="cg-future-card__body">
            <p class="cg-future-card__title">"¿Cómo le puedo sacar beneficio?"</p>
            <small class="cg-future-card__desc">Evalúas quilates, demanda, margen y canal de venta antes de mover un
              euro.</small>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
